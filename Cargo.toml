[package]
name = "pd-guard"
version = "0.1.0"
edition = "2021"
description = "Сервис идентификации, маскирования и демаскирования ПД для LLM"
license = "MIT"

[lib]
name = "pd_guard"
path = "src/lib.rs"

[[bin]]
name = "pd-guard"
path = "src/main.rs"

# Нагрузочный генератор (методика Приложения B ТЗ).
[[bin]]
name = "loadgen"
path = "tools/loadgen/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "net"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["server-auto", "client-legacy", "tokio", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1"
http = "1"
hyper-rustls = { version = "0.27", features = ["http1", "http2", "tls12", "ring", "webpki-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
aho-corasick = "1"
unicode-normalization = "0.1"
time = { version = "0.3", features = ["macros", "parsing", "formatting"] }
arc-swap = "1"
notify = "6"
moka = { version = "0.12", features = ["future"] }
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.8"
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
async-trait = "0.1"
bitflags = "2"
dashmap = "6"
futures = "0.3"
pin-project-lite = "0.2"
base64 = "0.22"
bincode = "1"
smallvec = "1"
once_cell = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"

[dev-dependencies]
proptest = "1"
insta = "1"
criterion = "0.5"
tempfile = "3"

[features]
default = ["mimalloc"]
redis = ["dep:fred"]
ner-onnx = []
mimalloc = ["dep:mimalloc"]

[dependencies.fred]
version = "8"
optional = true

[dependencies.mimalloc]
version = "0.1"
optional = true

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"

[[bench]]
name = "detection"
harness = false